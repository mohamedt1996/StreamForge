name: Build

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TORRSERVER_COMMIT: 98cdbacaddfac278a21a4a4d6424bd3a9dcd407f

jobs:
  torrserverkit:
    name: TorrServerKit (gomobile)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache TorrServerKit
        id: cache
        uses: actions/cache@v4
        with:
          path: Frameworks/TorrServerKit.xcframework
          key: torrserverkit-${{ env.TORRSERVER_COMMIT }}-ios17-v1
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: "20"
      - name: Build TorrServerKit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          corepack enable || true
          bash scripts/build-torrserverkit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TorrServerKit
          path: Frameworks/TorrServerKit.xcframework
          retention-days: 3

  ios:
    name: iOS / iPadOS
    needs: torrserverkit
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TorrServerKit
          path: Frameworks/TorrServerKit.xcframework
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build/spm
          key: spm-${{ hashFiles('project.yml') }}
      - name: Build (unsigned)
        run: bash scripts/xcbuild.sh StreamForge iphoneos 'generic/platform=iOS' xcodebuild-ios.log
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StreamForge.app Payload/
          zip -qry StreamForge-unsigned.ipa Payload
          ls -lh StreamForge-unsigned.ipa
          SIZE=$(stat -f%z StreamForge-unsigned.ipa)
          if [ "$SIZE" -lt 5000000 ]; then echo "::error::IPA is only $SIZE bytes; the binary is missing"; exit 1; fi
          BIN=build/Build/Products/Release-iphoneos/StreamForge.app/StreamForge
          SYMS=$(nm -gU "$BIN" 2>/dev/null; nm "$BIN" 2>/dev/null)
          echo "$SYMS" | grep -q "mpv_create" && echo "::notice::libmpv linked" || echo "::error::libmpv not linked"
          echo "$SYMS" | grep -qi "TorrserverkitStartServer" && echo "::notice::Embedded TorrServer linked" || echo "::warning::Embedded TorrServer NOT linked (on-device torrents disabled)"
          ls build/Build/Products/Release-iphoneos/StreamForge.app/PlugIns/ 2>/dev/null | grep -q "StreamForgeWidgets.appex" && echo "::notice::Widgets extension embedded" || echo "::error::Widgets extension missing"
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-iOS-unsigned-ipa
          path: StreamForge-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-ios-log
          path: xcodebuild-ios.log

  tvos:
    name: tvOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: |
          brew install xcodegen
          mkdir -p Frameworks/TorrServerKit.xcframework
          xcodegen generate
      - name: Build (unsigned)
        run: bash scripts/xcbuild.sh StreamForgeTV appletvos 'generic/platform=tvOS' xcodebuild-tvos.log
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/StreamForgeTV.app Payload/
          zip -qry StreamForgeTV-unsigned.ipa Payload
          ls build/Build/Products/Release-appletvos/StreamForgeTV.app/PlugIns/ 2>/dev/null | grep -q "StreamForgeTopShelf.appex" && echo "::notice::Top Shelf extension embedded" || echo "::error::Top Shelf extension missing"
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-tvOS-unsigned-ipa
          path: StreamForgeTV-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-tvos-log
          path: xcodebuild-tvos.log

  torrserver-android:
    name: TorrServer engine (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache engine
        id: cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/torrserverkit.aar
          key: torrserver-android-${{ env.TORRSERVER_COMMIT }}-api26-v1
      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: "20"
      - uses: actions/setup-java@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Build engine
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          corepack enable || true
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bash scripts/build-torrserver-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: torrserver-android
          path: android/app/libs/torrserverkit.aar
          if-no-files-found: warn
          retention-days: 3

  android:
    name: Android (phone + TV)
    needs: torrserver-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: torrserver-android
          path: android/app/libs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APKs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && unset ANDROID_KEYSTORE_PASSWORD
          [ -z "$ANDROID_KEY_PASSWORD" ] && unset ANDROID_KEY_PASSWORD
          ls -la android/app/libs || true
          bash scripts/gradle-annotate.sh :app:assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p apk
          for f in android/app/build/outputs/apk/release/*.apk; do
            name=$(basename "$f" | sed 's/app-/StreamForge-/; s/-release//')
            cp "$f" "apk/$name"
          done
          ls -lh apk
          unzip -l apk/StreamForge-universal.apk | grep -q "libmpv.so" && echo "::notice::libmpv packaged" || echo "::error::libmpv missing from APK"
          unzip -l apk/StreamForge-universal.apk | grep -qi "libgojni.so" && echo "::notice::TorrServer engine packaged" || echo "::warning::On-device torrent engine not packaged (remote TorrServer only)"
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-Android
          path: apk/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-log
          path: gradle.log

  sync-server:
    name: Sync server (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: server
    env:
      VERSION: 0.1.${{ github.run_number }}
      IMAGE: ghcr.io/mohamedt1996/streamforge-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Resolve modules
        run: |
          # go.sum is generated here until it is committed.
          [ -f go.sum ] || go mod tidy
          go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/streamforge-sync-${os}-${arch}${ext}" .
          done
          ls -lh dist
          ./dist/streamforge-sync-linux-amd64 -version
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-Sync-Server
          path: server/dist/streamforge-sync-*
      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=StreamForge Sync
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    needs: [ios, tvos, android, sync-server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StreamForge-iOS-unsigned-ipa
      - uses: actions/download-artifact@v4
        with:
          name: StreamForge-tvOS-unsigned-ipa
      - uses: actions/download-artifact@v4
        with:
          name: StreamForge-Android
      - uses: actions/download-artifact@v4
        with:
          name: StreamForge-Sync-Server
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: StreamForge 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Unsigned builds of ${{ github.sha }}. Sign and sideload with AltStore, SideStore, Sideloadly or similar.
            - `StreamForge-unsigned.ipa`: iPhone and iPad (iOS 17+)
            - `StreamForgeTV-unsigned.ipa`: Apple TV (tvOS 17+)
            - `StreamForge-universal.apk`: Android phones, tablets and Android TV (Android 8+). Per-ABI APKs are smaller: `arm64-v8a` for most modern devices, `armeabi-v7a` for older TV boxes.
            - `streamforge-sync-*`: self-hosted sync server binaries (Linux amd64/arm64, macOS arm64, Windows amd64). Docker: `ghcr.io/mohamedt1996/streamforge-sync:0.1.${{ github.run_number }}`.
          files: |
            StreamForge-unsigned.ipa
            StreamForgeTV-unsigned.ipa
            StreamForge-*.apk
            streamforge-sync-*
