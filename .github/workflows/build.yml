name: Build

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TORRSERVER_COMMIT: 98cdbacaddfac278a21a4a4d6424bd3a9dcd407f

jobs:
  torrserverkit:
    name: TorrServerKit (gomobile)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache TorrServerKit
        id: cache
        uses: actions/cache@v4
        with:
          path: Frameworks/TorrServerKit.xcframework
          key: torrserverkit-${{ env.TORRSERVER_COMMIT }}-ios17-v1
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.cache.outputs.cache-hit != 'true' && runner.environment == 'github-hosted'
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: "20"
      - name: Build TorrServerKit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          corepack enable || true
          bash scripts/build-torrserverkit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TorrServerKit
          path: Frameworks/TorrServerKit.xcframework
          retention-days: 3

  ios:
    name: iOS / iPadOS
    needs: torrserverkit
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TorrServerKit
          path: Frameworks/TorrServerKit.xcframework
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
          xcodegen generate
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build/spm
          key: spm-${{ hashFiles('project.yml') }}
      - name: Build (unsigned)
        run: bash scripts/xcbuild.sh StreamForge iphoneos 'generic/platform=iOS' xcodebuild-ios.log
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StreamForge.app Payload/
          zip -qry StreamForge-unsigned.ipa Payload
          ls -lh StreamForge-unsigned.ipa
          SIZE=$(stat -f%z StreamForge-unsigned.ipa)
          if [ "$SIZE" -lt 5000000 ]; then echo "::error::IPA is only $SIZE bytes; the binary is missing"; exit 1; fi
          BIN=build/Build/Products/Release-iphoneos/StreamForge.app/StreamForge
          SYMS=$(nm -gU "$BIN" 2>/dev/null; nm "$BIN" 2>/dev/null)
          echo "$SYMS" | grep -q "mpv_create" && echo "::notice::libmpv linked" || echo "::error::libmpv not linked"
          echo "$SYMS" | grep -qi "TorrserverkitStartServer" && echo "::notice::Embedded TorrServer linked" || echo "::warning::Embedded TorrServer NOT linked (on-device torrents disabled)"
          ls build/Build/Products/Release-iphoneos/StreamForge.app/PlugIns/ 2>/dev/null | grep -q "StreamForgeWidgets.appex" && echo "::notice::Widgets extension embedded" || echo "::error::Widgets extension missing"
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-iOS-unsigned-ipa
          path: StreamForge-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-ios-log
          path: xcodebuild-ios.log

  tvos:
    name: tvOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        if: runner.environment == 'github-hosted'
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodebuild -version
          mkdir -p Frameworks/TorrServerKit.xcframework
          xcodegen generate
      - name: Build (unsigned)
        run: bash scripts/xcbuild.sh StreamForgeTV appletvos 'generic/platform=tvOS' xcodebuild-tvos.log
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/StreamForgeTV.app Payload/
          zip -qry StreamForgeTV-unsigned.ipa Payload
          ls build/Build/Products/Release-appletvos/StreamForgeTV.app/PlugIns/ 2>/dev/null | grep -q "StreamForgeTopShelf.appex" && echo "::notice::Top Shelf extension embedded" || echo "::error::Top Shelf extension missing"
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-tvOS-unsigned-ipa
          path: StreamForgeTV-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-tvos-log
          path: xcodebuild-tvos.log

  torrserver-android:
    name: TorrServer engine (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache engine
        id: cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/torrserverkit.aar
          key: torrserver-android-${{ env.TORRSERVER_COMMIT }}-api26-v1
      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: "20"
      - uses: actions/setup-java@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: Build engine
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          corepack enable || true
          if [ -z "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -z "${ANDROID_NDK_HOME:-}" ] && [ -n "${ANDROID_HOME:-}" ]; then
            yes | sdkmanager --install "ndk;27.2.12479018" >/dev/null || true
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bash scripts/build-torrserver-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: torrserver-android
          path: android/app/libs/torrserverkit.aar
          if-no-files-found: warn
          retention-days: 3

  android:
    name: Android (phone + TV)
    needs: torrserver-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: torrserver-android
          path: android/app/libs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APKs
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A private signing key from repository secrets, when set, replaces the public sideload key.
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            [ -z "$ANDROID_KEY_PASSWORD" ] && export ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            echo "::notice::Signing with the private key from repository secrets"
          else
            echo "::warning::Signing with the public sideload key in the repo; add ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD secrets to use a private key"
          fi
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && unset ANDROID_KEYSTORE_PASSWORD
          [ -z "$ANDROID_KEY_PASSWORD" ] && unset ANDROID_KEY_PASSWORD
          ls -la android/app/libs || true
          bash scripts/gradle-annotate.sh :app:assembleRelease
      - name: Collect APKs
        run: |
          # Two apps: tv (Android TV / Google TV) and mobile (phones + tablets), each per ABI + universal.
          # app-tv-armeabi-v7a-release.apk -> StreamForge-tv-armeabi-v7a.apk
          mkdir -p apk
          find android/app/build/outputs/apk -path "*release*" -name "*.apk" | while read -r f; do
            name=$(basename "$f" | sed 's/^app-/StreamForge-/; s/-release//')
            cp "$f" "apk/$name"
          done
          ls -lh apk
          for app in tv mobile; do
            u="apk/StreamForge-$app-universal.apk"
            [ -f "$u" ] || { echo "::error::$u was not built"; continue; }
            unzip -l "$u" | grep -q "libmpv.so" && echo "::notice::$app: libmpv packaged" || echo "::error::$app: libmpv missing from APK"
            unzip -l "$u" | grep -qi "libgojni.so" && echo "::notice::$app: TorrServer engine packaged" || echo "::warning::$app: on-device torrent engine not packaged (remote TorrServer only)"
            if unzip -l "$u" | grep -q "lib/x86"; then echo "::error::$app: x86 libraries should not be packaged"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-Android
          path: apk/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-log
          path: gradle.log

  sync-server:
    name: Sync server (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: server
    env:
      VERSION: 0.1.${{ github.run_number }}
      IMAGE: ghcr.io/mohamedt1996/streamforge-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Resolve modules
        run: |
          # go.sum is generated here until it is committed.
          [ -f go.sum ] || go mod tidy
          go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/streamforge-sync-${os}-${arch}${ext}" .
          done
          ls -lh dist
          go run -ldflags "-X main.version=${VERSION}" . -version
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-Sync-Server
          path: server/dist/streamforge-sync-*
      - name: Check for Docker
        id: docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if command -v docker >/dev/null && docker info >/dev/null 2>&1; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::Docker isn't running on this runner; skipping the container image (binaries are still released)."; fi
      - name: Set up QEMU
        if: steps.docker.outputs.ok == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.docker.outputs.ok == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.docker.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-arch image
        if: steps.docker.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.title=StreamForge Sync
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    needs: [ios, tvos, android, sync-server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StreamForge-iOS-unsigned-ipa
      - uses: actions/download-artifact@v4
        with:
          name: StreamForge-tvOS-unsigned-ipa
      - uses: actions/download-artifact@v4
        with:
          name: StreamForge-Android
      - uses: actions/download-artifact@v4
        with:
          name: StreamForge-Sync-Server
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: StreamForge 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Unsigned builds of ${{ github.sha }}. Sign and sideload with AltStore, SideStore, Sideloadly or similar.
            - `StreamForge-unsigned.ipa`: iPhone and iPad (iOS 17+)
            - `StreamForgeTV-unsigned.ipa`: Apple TV (tvOS 17+)
            - Android TV / Google TV (Android 8+): `StreamForge-tv-armeabi-v7a.apk` for Chromecast with Google TV (4K and HD) and most TV boxes; `StreamForge-tv-arm64-v8a.apk` for 64-bit TV devices (Shield, Google TV Streamer); `StreamForge-tv-universal.apk` if unsure.
            - Android phones and tablets (Android 8+): `StreamForge-mobile-arm64-v8a.apk` for most devices, `StreamForge-mobile-armeabi-v7a.apk` for older 32-bit ones, `StreamForge-mobile-universal.apk` if unsure.
            - `streamforge-sync-*`: self-hosted sync server binaries (Linux amd64/arm64, macOS arm64, Windows amd64). Docker: `ghcr.io/mohamedt1996/streamforge-sync:0.1.${{ github.run_number }}`.
          files: |
            StreamForge-unsigned.ipa
            StreamForgeTV-unsigned.ipa
            StreamForge-*.apk
            streamforge-sync-*
