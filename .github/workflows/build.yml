name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TORRSERVER_COMMIT: 98cdbacaddfac278a21a4a4d6424bd3a9dcd407f

jobs:
  torrserverkit:
    name: TorrServerKit (gomobile)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache TorrServerKit
        id: cache
        uses: actions/cache@v4
        with:
          path: Frameworks/TorrServerKit.xcframework
          key: torrserverkit-${{ env.TORRSERVER_COMMIT }}-ios17-v1
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          xcode-version: latest-stable
      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: "20"
      - name: Build TorrServerKit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          corepack enable || true
          bash scripts/build-torrserverkit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TorrServerKit
          path: Frameworks/TorrServerKit.xcframework
          retention-days: 3

  ios:
    name: iOS / iPadOS
    needs: torrserverkit
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TorrServerKit
          path: Frameworks/TorrServerKit.xcframework
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build/spm
          key: spm-${{ hashFiles('project.yml') }}
      - name: Build (unsigned)
        run: bash scripts/xcbuild.sh StreamForge iphoneos 'generic/platform=iOS' xcodebuild-ios.log
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/StreamForge.app Payload/
          zip -qry StreamForge-unsigned.ipa Payload
          ls -lh StreamForge-unsigned.ipa
          SIZE=$(stat -f%z StreamForge-unsigned.ipa)
          if [ "$SIZE" -lt 5000000 ]; then echo "::error::IPA is only $SIZE bytes; the binary is missing"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-iOS-unsigned-ipa
          path: StreamForge-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-ios-log
          path: xcodebuild-ios.log
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: StreamForge-unsigned.ipa

  tvos:
    name: tvOS
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: |
          brew install xcodegen
          mkdir -p Frameworks/TorrServerKit.xcframework
          xcodegen generate
      - name: Build (unsigned)
        run: bash scripts/xcbuild.sh StreamForgeTV appletvos 'generic/platform=tvOS' xcodebuild-tvos.log
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/StreamForgeTV.app Payload/
          zip -qry StreamForgeTV-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: StreamForge-tvOS-unsigned-ipa
          path: StreamForgeTV-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-tvos-log
          path: xcodebuild-tvos.log
