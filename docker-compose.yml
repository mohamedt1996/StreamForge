# Example: docker compose up -d   →   open http://<host>:8484 and create the admin account.
services:
  streamforge-sync:
    image: ghcr.io/mohamedt1996/streamforge-sync:latest
    # build: .            # or build from this directory instead of pulling
    container_name: streamforge-sync
    restart: unless-stopped
    ports:
      - "8484:8484"
    volumes:
      - streamforge-data:/data
    environment:
      STREAMFORGE_NAME: "Home"
      # Optional: create the first admin on first start instead of using the setup page.
      # STREAMFORGE_ADMIN_USER: "mo"
      # STREAMFORGE_ADMIN_PASSWORD: "change-me-please"
      # STREAMFORGE_OPEN_SIGNUP: "false"
      # Set to "true" only when a reverse proxy (Caddy, nginx, Traefik) sits in front:
      # STREAMFORGE_TRUST_PROXY: "true"

volumes:
  streamforge-data:
